<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- %BASE_URL% is substituted by Vite at build time. A bare "/favicon.svg"
         is not rewritten by `base`, so it would 404 on a project Pages site. -->
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="canonical" href="https://ziwen-xie.github.io/SkeletonMap/" />

    <title>SkeletonMap — Understand your X-ray, one bone at a time</title>
    <meta
      name="description"
      content="An educational viewer that pairs a foot X-ray with an interactive 3D skeleton. Hover any bone to see what it does and what commonly goes wrong with it, in plain language. Images are processed entirely in your browser."
    />
    <meta name="color-scheme" content="light" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="SkeletonMap" />
    <meta property="og:url" content="https://ziwen-xie.github.io/SkeletonMap/" />
    <meta
      property="og:description"
      content="Hover any bone on an X-ray to see it light up on a 3D skeleton, with plain-language explanations. Built for patients, students and clinicians."
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
